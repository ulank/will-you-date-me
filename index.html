<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6d3d9">
    <meta name="description" content="Кездесуге шақыру">
    <title>Жанерке, менімен кездесуге барасың ба?</title>
    <link rel="stylesheet" href="styles.css">
    <!-- "Иә" басылғанда бірден көрінуі үшін алдын ала жүктейміз -->
    <link rel="preload" as="image" href="https://media.giphy.com/media/UMon0fuimoAN9ueUNP/giphy.gif">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
</head>
<body>

<!-- Фондағы қошқар мүйіз өрнегі (статикалық, өте бәсең) -->
<svg class="bg-ornament" aria-hidden="true" focusable="false">
    <defs>
        <g id="koshkar-muiz" fill="none" stroke="#e94d58" stroke-width="3"
           stroke-linecap="round" stroke-linejoin="round">
            <path d="M60 54 C45 55 30 50 24 38 C18 26 26 14 38 16.5 C48 18.5 50.5 30 42.5 33 C36.5 35 32 30 35 26"/>
            <path d="M60 54 C75 55 90 50 96 38 C102 26 94 14 82 16.5 C72 18.5 69.5 30 77.5 33 C83.5 35 88 30 85 26"/>
            <path d="M60 54 L60 62"/>
            <path d="M49 62 L71 62"/>
        </g>
        <pattern id="ornament-pattern" width="120" height="120" patternUnits="userSpaceOnUse">
            <use href="#koshkar-muiz"/>
            <use href="#koshkar-muiz" transform="translate(60,52) rotate(180 60 38)"/>
            <use href="#koshkar-muiz" transform="translate(-60,52) rotate(180 60 38)"/>
        </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#ornament-pattern)"/>
</svg>

<canvas id="fireworks" aria-hidden="true"></canvas>

<main class="stage">

    <!-- 1-экран: сұрақ -->
    <section class="screen is-active" id="screen-ask" aria-labelledby="q-title">
        <div class="card">
            <img class="gif" id="gif-ask" width="304" height="264" alt=""
                 src="https://media.giphy.com/media/FTGah7Mx3ss04PcasF/giphy.gif">

            <h1 class="title" id="q-title">Жанерке, менімен кездесуге барасың ба?</h1>
            <p class="subtitle"></p>

            <div class="arena" id="arena">
                <div class="arena__row">
                    <button class="btn btn--yes" id="btn-yes" type="button">Иә</button>
                    <button class="btn btn--no" id="btn-no" type="button">Жоқ</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 2-экран: кездесу түрі -->
    <section class="screen" id="screen-type" aria-labelledby="t-title" hidden>
        <div class="card">
            <h2 class="title" id="t-title">Қайда барамыз?</h2>
            <p class="subtitle">Көңілің қалағанын таңда</p>

            <div class="options" id="type-options"></div>

            <button class="back" type="button" data-back>← Артқа</button>
        </div>
    </section>

    <!-- 3-экран: нақтылау (асхана түрі, тауда не істейміз, т.б.) -->
    <section class="screen" id="screen-detail" aria-labelledby="d-title" hidden>
        <div class="card">
            <h2 class="title" id="d-title"></h2>
            <p class="subtitle" id="d-subtitle">Біреуін таңда</p>

            <div class="options" id="detail-options"></div>

            <form class="form" id="detail-custom" hidden novalidate>
                <input class="field" id="detail-input" type="text" maxlength="120"
                       autocomplete="off" placeholder="Мысалы: боулинг, театр, концерт…">
                <button class="btn btn--yes btn--wide" type="submit">Әрі қарай</button>
            </form>

            <button class="back" type="button" data-back>← Артқа</button>
        </div>
    </section>

    <!-- 4-экран: күні мен уақыты -->
    <section class="screen" id="screen-when" aria-labelledby="w-title" hidden>
        <div class="card">
            <h2 class="title" id="w-title">Қашан кездесеміз?</h2>
            <p class="subtitle">Күні мен уақытын таңда</p>

            <div class="days" id="day-list" role="group" aria-label="Күні"></div>
            <div class="times" id="time-list" role="group" aria-label="Уақыты"></div>

            <button class="btn btn--yes btn--wide" id="btn-when" type="button" disabled>Әрі қарай</button>
            <button class="back" type="button" data-back>← Артқа</button>
        </div>
    </section>

    <!-- 5-экран: телефон нөмірі -->
    <section class="screen" id="screen-phone" aria-labelledby="p-title" hidden>
        <div class="card">
            <h2 class="title" id="p-title">Нөміріңді қалдыршы</h2>
            <p class="subtitle">Мен саған өзім хабарласамын&nbsp;📞</p>

            <form class="form" id="phone-form" novalidate>
                <input class="field" id="phone-input" type="tel" inputmode="tel" autocomplete="tel"
                       maxlength="20" placeholder="+7 700 123 45 67" aria-label="Телефон нөмірі"
                       aria-describedby="phone-error">
                <p class="error" id="phone-error" role="alert" hidden>Нөмірді толық жазшы</p>
                <button class="btn btn--yes btn--wide" id="btn-send" type="submit">Жіберу</button>
            </form>

            <button class="back" type="button" data-back>← Артқа</button>
        </div>
    </section>

    <!-- 6-экран: дайын -->
    <section class="screen" id="screen-yay" aria-labelledby="y-title" hidden>
        <div class="card">
            <img class="gif" id="gif-yes" width="272" height="242" alt=""
                 src="https://media.giphy.com/media/UMon0fuimoAN9ueUNP/giphy.gif">

            <h2 class="title" id="y-title">Бәрекелді! 🎉</h2>
            <p class="subtitle" id="y-subtitle">Кездескенше! Мен саған хабарласамын&nbsp;💛</p>

            <p class="summary" id="summary"></p>
        </div>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
